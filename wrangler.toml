name = "holdt"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
# Keeps any outbound fetch the OAuth library makes (Client ID Metadata Documents, only if CIMD = "on") off private hosts.
compatibility_flags = ["global_fetch_strictly_public"]
workers_dev = true
# Your own domain (docs/custom-domain.md). The zone must be on this Cloudflare account. Passkeys belong to one host,
# so after switching, reset and add devices again, then set workers_dev = false.
# routes = [{ pattern = "connect.example.com", custom_domain = true }]
# Version URLs would keep every uploaded version (including pre-fix ones) callable with production secrets and KV.
preview_urls = false

[vars]
# Only these OAuth callbacks can receive a code. Taken from the live Grok Bot client records in OAUTH_KV on Oct 17, 2026
# (the client holding the current grant registered exactly these two). Add the desktop app's callback here if you connect from it.
# First deploy: "report" only logs Origin headers on /mcp. After `npm run tail` shows Grok Bot sends none (or only allowed ones),
# change this to "enforce" and deploy again (see docs/SECURITY.md, Origin rollout).
ORIGIN_CHECK = "report"
# Passkey one-tap connect (src/passkey.ts). "on" shows Allow with Face ID once a device is enrolled. The approval code always stays.
PASSKEYS = "off"
REDIRECT_ALLOWLIST = "https://www.cursor.com/agents/mcp/oauth/callback"

# Secrets are set by `npm run setup` (wrangler secret put, via stdin). Never put them here.
# ICLOUD_EMAIL, ICLOUD_APP_PASSWORD, CONFIRM_SECRET, GRANT_EPOCH, TIMEZONE, WRITES_ENABLED,
# APPROVAL_CODE_HASH, APPROVAL_CODE_ISSUED
# Optional: CALENDAR_ALLOWLIST = "Home,Work"

# Off by default so nothing about your calendar leaves the connector's own redacted log lines.
# No secret ever appears in a URL (OAuth uses POST bodies and headers), so turning this on is safe.
# Use `npx wrangler tail` for live logs either way.
[observability]
enabled = false

# OAuth grants and tokens (stored hashed by @cloudflare/workers-oauth-provider).
# Create once with: npx wrangler kv namespace create OAUTH_KV  and paste the id here.
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "f9717fcde9ab4d809ead25642d5c0470"

# One Durable Object per owner makes "only once" truly atomic: spent confirm and undo tokens, approval-code tries,
# and the used-code marker (KV can't compare-and-set). SQLite-backed, so it works on the free plan.
[[durable_objects.bindings]]
name = "GUARD"
class_name = "Guard"

[[migrations]]
tag = "v1-guard"
new_sqlite_classes = ["Guard"]

# Rate limits (Workers Rate Limiting, period 10 or 60 s). Sign-up and approval-code submits per IP, MCP calls per connection.
[[unsafe.bindings]]
name = "RL_REGISTER"
type = "ratelimit"
namespace_id = "7101"
simple = { limit = 10, period = 60 }

[[unsafe.bindings]]
name = "RL_APPROVE"
type = "ratelimit"
namespace_id = "7102"
simple = { limit = 10, period = 60 }

[[unsafe.bindings]]
name = "RL_MCP"
type = "ratelimit"
namespace_id = "7103"
simple = { limit = 120, period = 60 }
