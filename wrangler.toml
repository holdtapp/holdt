name = "holdt"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
# Lets the OAuth library fetch Client ID Metadata Documents (the MCP 2026-07-28 default) without SSRF into this zone.
compatibility_flags = ["global_fetch_strictly_public"]
workers_dev = true
# Version URLs would keep every uploaded version (including pre-fix ones) callable with production secrets and KV.
preview_urls = false

# Secrets are set by `npm run setup` (wrangler secret put, via stdin). Never put them here.
# ICLOUD_EMAIL, ICLOUD_APP_PASSWORD, CONFIRM_SECRET, GRANT_EPOCH, TIMEZONE, WRITES_ENABLED,
# APPROVAL_CODE_HASH, APPROVAL_CODE_ISSUED
# Optional: CALENDAR_ALLOWLIST = "Home,Work"

# Off by default so nothing about your calendar leaves the connector's own redacted log lines.
# No secret ever appears in a URL (OAuth uses POST bodies and headers), so turning this on is safe.
# Use `npx wrangler tail` for live logs either way.
[observability]
enabled = false

# OAuth grants and tokens (stored hashed by @cloudflare/workers-oauth-provider).
# Create once with: npx wrangler kv namespace create OAUTH_KV  and paste the id here.
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "f9717fcde9ab4d809ead25642d5c0470"

# One Durable Object per owner makes "only once" truly atomic: spent confirm and undo tokens, approval-code tries,
# and the used-code marker (KV can't compare-and-set). SQLite-backed, so it works on the free plan.
[[durable_objects.bindings]]
name = "GUARD"
class_name = "Guard"

[[migrations]]
tag = "v1-guard"
new_sqlite_classes = ["Guard"]
